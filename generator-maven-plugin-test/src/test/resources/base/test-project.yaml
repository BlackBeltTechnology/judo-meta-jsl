templates:
  - name: testOverride
    pathExpression: "#actorType.name + '/actorToOverride'"
    templateName: test1/actorToOverride.hbs
    actorTypeBased: true

  - name: testReplace
    pathExpression: "#actorType.name + '/actorToReplace'"
    templateName: test1/actorToReplace.hbs
    actorTypeBased: true

  - name: testDelete
    pathExpression: "#actorType.name + '/actorToDelete'"
    templateName: test1/actorToDelete.hbs
    actorTypeBased: true

  - name: testNotGenerated
    pathExpression: "#actorType.name + '/actorToNotGenerated'"
    templateName: test1/actorToNotGenerated.hbs
    actorTypeBased: true
    conditionExpression: false

  - name: baseFactory
    factoryExpression: "#stringListFactory"
    pathExpression: "#self + '.baseFactory'"
    templateName: test1/baseFactory.hbs
    actorTypeBased: false

  - name: language
    factoryExpression: "#languages"
    pathExpression: "#actorType.name + '/lang_' + #self + '.properties'"
    templateName: test1/language.hbs
    actorTypeBased: true
